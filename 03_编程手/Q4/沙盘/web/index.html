<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>吉隆沟 3D 推演沙盘 v0.1</title>
  <link rel="stylesheet" href="./styles.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.js",
        "three/addons/": "./vendor/addons/"
      }
    }
  </script>
</head>
<body>
  <div id="app"></div>
  <div id="labels"></div>

  <div id="loading">
    <div class="loader"></div>
    <div>正在加载地形与沟道数据…</div>
  </div>

  <header id="topbar">
    <div class="brand">
      <strong>吉隆沟 · 3D 推演沙盘</strong>
      <span>v0.1 · 地形/沟道/冰川/Q3 预警 · 情景预览</span>
    </div>
    <div class="top-actions">
      <button id="btn-cinema" class="ghost">电影巡航</button>
      <button id="btn-reset" class="ghost">重置视角</button>
      <button id="btn-share" class="primary">复制分享链接</button>
    </div>
  </header>

  <aside id="left-panel">
    <section class="card">
      <h3>情景</h3>
      <div class="seg" id="scenario-seg">
        <button data-scenario="2026" class="active">2026 冰崩链</button>
        <button data-scenario="2025">2025 GLOF</button>
      </div>
      <p class="hint" id="scenario-note">2026-08-26 10:30；冰崩—碎屑流—泥石流—山洪链。</p>
    </section>

    <section class="card">
      <h3>释放参数</h3>
      <label>释放体积 V0 <output id="v0-out">3.0e5 m³</output></label>
      <input id="v0" type="range" min="1" max="6" step="0.1" value="3" />
      <label>Voellmy μ <output id="mu-out">0.15</output></label>
      <input id="mu" type="range" min="0.05" max="0.35" step="0.01" value="0.15" />
      <label>Voellmy ξ <output id="xi-out">300</output></label>
      <input id="xi" type="range" min="100" max="600" step="10" value="300" />
      <p class="hint">v0.1 是快速情景预览，用于交互/画面；尚未接 Q4 HLL/Voellmy 求解器，不能当验证结果。</p>
    </section>

    <section class="card">
      <h3>图层</h3>
      <label class="check"><input type="checkbox" id="layer-hazard" checked /> 灾害面</label>
      <label class="check"><input type="checkbox" id="layer-channel" checked /> 主沟</label>
      <label class="check"><input type="checkbox" id="layer-glacier" checked /> 冰川源区</label>
      <label class="check"><input type="checkbox" id="layer-labels" checked /> 标签</label>
      <label class="check"><input type="checkbox" id="layer-warning" checked /> 预警圈</label>
    </section>

    <section class="card">
      <h3>Q3 条件预警</h3>
      <div id="q3-panel" class="q3-panel">加载中…</div>
    </section>
  </aside>

  <section id="bottom-bar">
    <div class="play-row">
      <button id="btn-play" class="primary">▶ 播放</button>
      <input id="time" type="range" min="0" max="1800" step="5" value="0" />
      <span id="time-out" class="mono">00:00 / 30:00</span>
      <button id="btn-speed" class="ghost">1×</button>
    </div>
    <div class="bottom-grid">
      <div class="stats" id="stats"></div>
      <canvas id="profile" width="620" height="110"></canvas>
    </div>
  </section>

  <div id="toast"></div>

  <script type="module" src="./main.js"></script>
</body>
</html>
